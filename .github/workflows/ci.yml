name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The double-booking guarantee is a Postgres constraint, so the database
    # tests need a real Postgres rather than a mock.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_platform_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall generates the Prisma client.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      # Next writes the route types typecheck relies on during a build, so
      # build must come first.
      - run: npm run build
      - run: npm run typecheck
